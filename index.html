<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Glintwave — demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0f; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .controls {
    position: fixed;
    top: 12px;
    left: 12px;
    width: 220px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    font-family: sans-serif;
    background: rgba(20, 20, 26, 0.7);
    border: 1px solid #333;
    border-radius: 8px;
    padding: 12px;
    backdrop-filter: blur(6px);
    max-height: calc(100vh - 24px);
    overflow-y: auto;
  }
  .row { display: flex; flex-direction: column; gap: 4px; }
  .row-label {
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #999;
  }
  .btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
  button {
    font-size: 12px;
    padding: 6px 10px;
    background: #1a1a22;
    color: #ccc;
    border: 1px solid #333;
    border-radius: 4px;
    cursor: pointer;
    text-transform: capitalize;
  }
  button.active { background: #f5d98b; color: #111; border-color: #f5d98b; }
  input[type="number"] {
    width: 100%;
    box-sizing: border-box;
    background: #1a1a22;
    color: #f5d98b;
    border: 1px solid #333;
    border-radius: 4px;
    padding: 6px 8px;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .hint { font-size: 10px; color: #777; }
  .hint.error { color: #e07a7a; }
  .color-row { display: flex; align-items: center; gap: 6px; }
  .color-row input[type="color"] {
    width: 30px;
    height: 28px;
    padding: 0;
    border: 1px solid #333;
    border-radius: 4px;
    background: none;
    flex-shrink: 0;
  }
  .color-row input[type="number"] { width: 52px; flex-shrink: 0; }
  .color-row .pct { font-size: 11px; color: #999; }
  .color-row button { padding: 4px 8px; flex-shrink: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="controls">
  <div class="row">
    <label class="row-label" for="backgroundPicker">Background</label>
    <input type="color" id="backgroundPicker" value="#0a0a0f" />
  </div>
  <div class="row">
    <label class="row-label" for="directionInput">Direction (degrees, 0 = up)</label>
    <input type="number" id="directionInput" min="0" max="360" value="90" />
    <div class="btn-group" id="directionPresets">
      <button data-deg="0">Up</button>
      <button data-deg="90" class="active">Right</button>
      <button data-deg="180">Down</button>
      <button data-deg="270">Left</button>
    </div>
  </div>
  <div class="row">
    <div class="row-label" id="effectLabel">Fluid effect (hover)</div>
    <div class="btn-group" id="effectRow" role="group" aria-labelledby="effectLabel"></div>
    <div class="hint">Applies continuously while hovering. Click-burst is temporarily disabled.</div>
  </div>
  <div class="row">
    <label class="row-label" for="speedInput">Speed (px/s)</label>
    <input type="number" id="speedInput" min="0" value="120" />
  </div>
  <div class="row">
    <label class="row-label" for="viscosityInput">Viscosity (0–1)</label>
    <input type="number" id="viscosityInput" min="0" max="1" step="0.05" value="0.5" />
  </div>
  <div class="row">
    <label class="row-label" for="radiusInput">Pointer radius (px)</label>
    <input type="number" id="radiusInput" min="0" value="150" />
  </div>
  <div class="row">
    <label class="row-label" for="strengthInput">Pointer strength</label>
    <input type="number" id="strengthInput" min="0" value="200" />
  </div>
  <div class="row">
    <label class="row-label" for="densityInput">Glitter density</label>
    <input type="number" id="densityInput" min="1" value="10" />
    <div class="hint error" id="densityWarning" role="alert" style="display: none;">High density causes severe lag (O(n²) separation cost) — keep it under ~50 for smooth performance.</div>
  </div>
  <div class="row">
    <div class="row-label" id="colorLabel">Glitter colors</div>
    <div id="colorList" role="group" aria-labelledby="colorLabel"></div>
    <button id="addColorBtn">+ Add color</button>
  </div>
  <div class="row">
    <div class="row-label" id="configLabel">Export / Import</div>
    <div class="btn-group" role="group" aria-labelledby="configLabel">
      <button id="copyConfigBtn">Copy JSON</button>
      <button id="downloadConfigBtn">Download JSON</button>
      <button id="loadConfigBtn">Load JSON</button>
    </div>
    <div class="hint" id="configStatus" role="status"></div>
  </div>
</div>
<script src="glitter-shape.js"></script>
<script src="fluid-effects.js"></script>
<script src="flow.js"></script>
<script src="glitter-collection.js"></script>
<script src="glintwave.js"></script>
<script>
(function () {
  "use strict";

  var canvas = document.getElementById("c");

  function sizeCanvas() {
    var ratio = window.devicePixelRatio || 1;
    canvas.width = Math.round(window.innerWidth * ratio);
    canvas.height = Math.round(window.innerHeight * ratio);
    return ratio;
  }

  var glintwave = new Glintwave(canvas, { pixelRatio: sizeCanvas() });
  window.addEventListener("resize", function () {
    glintwave.setOptions({ pixelRatio: sizeCanvas() });
  });

  // ---------- control panel wiring — every control just calls setOptions() ----------

  var backgroundPicker = document.getElementById("backgroundPicker");
  backgroundPicker.addEventListener("input", function () {
    glintwave.setOptions({ background: backgroundPicker.value });
  });

  var directionInput = document.getElementById("directionInput");
  var directionPresetButtons = document.querySelectorAll("#directionPresets button");

  function syncDirectionButtons(deg) {
    for (var b = 0; b < directionPresetButtons.length; b++) {
      directionPresetButtons[b].classList.toggle("active", parseFloat(directionPresetButtons[b].dataset.deg) === deg);
    }
  }
  function setDirection(deg) {
    directionInput.value = deg;
    glintwave.setOptions({ direction: deg });
    syncDirectionButtons(deg);
  }
  directionInput.addEventListener("input", function () {
    var deg = parseFloat(directionInput.value);
    if (!isNaN(deg)) setDirection(deg);
  });
  for (var di = 0; di < directionPresetButtons.length; di++) {
    directionPresetButtons[di].addEventListener("click", function (e) {
      setDirection(parseFloat(e.currentTarget.dataset.deg));
    });
  }

  // Built from Glintwave.effects' own keys (fluid-effects.js) rather than
  // hardcoded buttons, so adding a new effect there is all it takes to get a
  // button here too.
  var effectRow = document.getElementById("effectRow");
  function syncEffectButtons(effectName) {
    var buttons = effectRow.querySelectorAll("button");
    for (var b = 0; b < buttons.length; b++) {
      buttons[b].classList.toggle("active", buttons[b].textContent === effectName);
    }
  }
  Object.keys(Glintwave.effects).forEach(function (name, index) {
    var btn = document.createElement("button");
    btn.textContent = name;
    if (index === 0) btn.classList.add("active");
    btn.addEventListener("click", function () {
      glintwave.setOptions({ fluidEffect: name });
      syncEffectButtons(name);
    });
    effectRow.appendChild(btn);
  });

  function bindNumberInput(inputId, optionName) {
    var input = document.getElementById(inputId);
    input.addEventListener("input", function () {
      var value = parseFloat(input.value);
      if (isNaN(value)) return;
      var options = {};
      options[optionName] = value;
      glintwave.setOptions(options);
    });
  }

  bindNumberInput("speedInput", "speed");
  bindNumberInput("viscosityInput", "viscosity");
  bindNumberInput("radiusInput", "pointerRadius");
  bindNumberInput("strengthInput", "pointerStrength");
  bindNumberInput("densityInput", "glitterDensity");

  // Separation cost is O(n^2) in fleck count (flow.js's applySeparation),
  // so density values much past this start dropping frames — warn rather
  // than silently letting the demo look "broken" when it's actually just slow.
  var DENSITY_WARNING_THRESHOLD = 50;
  var densityInput = document.getElementById("densityInput");
  var densityWarning = document.getElementById("densityWarning");
  function updateDensityWarning() {
    var value = parseFloat(densityInput.value);
    densityWarning.style.display = !isNaN(value) && value > DENSITY_WARNING_THRESHOLD ? "block" : "none";
  }
  densityInput.addEventListener("input", updateDensityWarning);
  updateDensityWarning();

  // ---------- glitter colors: add/remove/edit, each with its own density% ----------

  var colorEntries = [
    { color: "#fff8dc", density: 50 },
    { color: "#f5d98b", density: 30 },
    { color: "#ffd700", density: 20 },
  ];
  var colorList = document.getElementById("colorList");

  function applyColors() {
    glintwave.setOptions({ glitterColors: colorEntries });
  }

  function renderColorList() {
    colorList.innerHTML = "";
    colorEntries.forEach(function (entry, index) {
      var row = document.createElement("div");
      row.className = "color-row";

      var colorInput = document.createElement("input");
      colorInput.type = "color";
      colorInput.setAttribute("aria-label", "Color " + (index + 1));
      colorInput.value = entry.color;
      colorInput.addEventListener("input", function () {
        entry.color = colorInput.value;
        applyColors();
      });

      var densityInput = document.createElement("input");
      densityInput.type = "number";
      densityInput.min = "0";
      densityInput.max = "100";
      densityInput.setAttribute("aria-label", "Share of color " + (index + 1) + " in percent");
      densityInput.value = entry.density;
      densityInput.addEventListener("input", function () {
        var value = parseFloat(densityInput.value);
        if (isNaN(value)) return;
        entry.density = Math.max(0, value);
        applyColors();
      });

      var pct = document.createElement("span");
      pct.className = "pct";
      pct.textContent = "%";

      var removeBtn = document.createElement("button");
      removeBtn.textContent = "×";
      removeBtn.setAttribute("aria-label", "Remove color " + (index + 1));
      removeBtn.addEventListener("click", function () {
        if (colorEntries.length <= 1) return; // always need at least one color
        colorEntries.splice(index, 1);
        renderColorList();
        applyColors();
      });

      row.appendChild(colorInput);
      row.appendChild(densityInput);
      row.appendChild(pct);
      row.appendChild(removeBtn);
      colorList.appendChild(row);
    });
  }

  document.getElementById("addColorBtn").addEventListener("click", function () {
    colorEntries.push({ color: "#ffffff", density: 20 });
    renderColorList();
    applyColors();
  });

  renderColorList();
  applyColors();

  // ---------- config export/import: pure helpers ----------

  function buildExportConfig(options) {
    return {
      background: options.background,
      direction: options.direction,
      speed: options.speed,
      viscosity: options.viscosity,
      fluidEffect: options.fluidEffect,
      pointerRadius: options.pointerRadius,
      pointerStrength: options.pointerStrength,
      glitterDensity: options.glitterDensity,
      glitterColors: options.glitterColors,
    };
  }

  function parseConfig(jsonText) {
    var parsed;
    try {
      parsed = JSON.parse(jsonText);
    } catch (e) {
      return { ok: false, error: "Invalid JSON" };
    }
    if (typeof parsed !== "object" || parsed === null || Array.isArray(parsed)) {
      return { ok: false, error: "Invalid JSON" };
    }
    return { ok: true, config: parsed };
  }

  // ---------- config export/import: UI wiring ----------

  var configStatus = document.getElementById("configStatus");
  var configStatusTimer = null;

  function showConfigStatus(message, isError) {
    configStatus.textContent = message;
    configStatus.classList.toggle("error", !!isError);
    if (configStatusTimer) clearTimeout(configStatusTimer);
    configStatusTimer = setTimeout(function () {
      configStatus.textContent = "";
      configStatus.classList.remove("error");
    }, isError ? 3000 : 1500);
  }

  document.getElementById("copyConfigBtn").addEventListener("click", function () {
    var json = JSON.stringify(buildExportConfig(glintwave.options), null, 2);
    navigator.clipboard.writeText(json).then(
      function () { showConfigStatus("Copied!", false); },
      function () { showConfigStatus("Copy failed", true); }
    );
  });

  document.getElementById("downloadConfigBtn").addEventListener("click", function () {
    var json = JSON.stringify(buildExportConfig(glintwave.options), null, 2);
    var blob = new Blob([json], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "glintwave-config.json";
    a.click();
    URL.revokeObjectURL(url);
    showConfigStatus("Downloaded", false);
  });

  function syncControls(options) {
    if (/^#[0-9a-f]{6}$/i.test(options.background)) backgroundPicker.value = options.background;
    directionInput.value = options.direction;
    syncDirectionButtons(options.direction);
    document.getElementById("speedInput").value = options.speed;
    document.getElementById("viscosityInput").value = options.viscosity;
    document.getElementById("radiusInput").value = options.pointerRadius;
    document.getElementById("strengthInput").value = options.pointerStrength;
    densityInput.value = options.glitterDensity;
    updateDensityWarning();
    syncEffectButtons(options.fluidEffect);
    colorEntries.length = 0;
    options.glitterColors.forEach(function (entry) {
      colorEntries.push({ color: entry.color, density: entry.density });
    });
    renderColorList();
  }

  document.getElementById("loadConfigBtn").addEventListener("click", function () {
    var text = window.prompt("Paste a Glintwave config JSON:");
    if (text === null) return; // user cancelled the prompt
    var result = parseConfig(text);
    if (!result.ok) {
      showConfigStatus(result.error, true);
      return;
    }
    var ignored = glintwave.setOptions(result.config);
    syncControls(glintwave.options);
    if (ignored.length > 0) showConfigStatus("Loaded, ignored invalid: " + ignored.join(", "), true);
    else showConfigStatus("Loaded", false);
  });
})();
</script>
</body>
</html>
